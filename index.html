<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Drive System — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🚗</div>
      <h1>Smart Drive System</h1>
      <p>Driving School Management Portal</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        <div class="form-error" id="email-error"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        <div class="form-error" id="password-error"></div>
      </div>
      <div class="form-error" id="login-error" style="margin-bottom:10px;text-align:center;font-size:13px;"></div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <div class="auth-footer-link" style="margin-top:14px;">
      New student? <a href="register.html">Create an account</a>
    </div>

    <hr style="margin:22px 0;">
    <div style="background:#f8fafc;border-radius:8px;padding:14px 16px;font-size:12px;color:#64748b;">
      <strong style="color:#1e3a5f;display:block;margin-bottom:6px;">Demo Credentials</strong>
      <div>Admin: admin@smartdrive.com / admin123</div>
      <div>Instructor: instructor@smartdrive.com / pass123</div>
      <div>Staff: staff@smartdrive.com / pass123</div>
      <div>Student: student@smartdrive.com / pass123</div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script>
    // Redirect if already logged in
    (function () {
      const user = SDS_AUTH.getCurrentUser();
      if (user) redirectToDashboard(user.role);
    })();

    function redirectToDashboard(role) {
      const map = { admin: 'admin.html', student: 'student.html', instructor: 'instructor.html', staff: 'staff.html' };
      window.location.href = map[role] || 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('email-error').textContent = '';
      document.getElementById('password-error').textContent = '';
      document.getElementById('login-error').textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      let valid = true;

      if (!email) { document.getElementById('email-error').textContent = 'Email is required.'; valid = false; }
      if (!password) { document.getElementById('password-error').textContent = 'Password is required.'; valid = false; }
      if (!valid) return;

      const user = SDS_AUTH.login(email, password);
      if (user) {
        redirectToDashboard(user.role);
      } else {
        document.getElementById('login-error').textContent = 'Invalid email or password. Please try again.';
      }
    });
  </script>
</body>
</html>
