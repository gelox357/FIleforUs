<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Drive System — Staff</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sds-layout">
  <!-- Sidebar -->
  <aside class="sds-sidebar">
    <div class="sds-sidebar-brand">
      <h1>🚗 Smart Drive</h1>
      <span class="role-badge">Staff</span>
    </div>
    <nav>
      <a href="#" class="active" data-tab="gate"><span class="nav-icon">🚪</span> Gate Verification</a>
      <a href="#" data-tab="vehicles"><span class="nav-icon">🚘</span> Vehicle Monitor</a>
      <a href="#" data-tab="incidents"><span class="nav-icon">⚠️</span> Incident Reporting</a>
      <a href="#" data-tab="reports"><span class="nav-icon">📋</span> Reports</a>
    </nav>
    <div class="sds-sidebar-footer">
      <div class="user-name"  id="sidebar-name">—</div>
      <div class="user-email" id="sidebar-email">—</div>
      <button class="btn-logout" onclick="SDS_AUTH.logout()">Sign Out</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="sds-main">
    <div class="sds-topbar">
      <h2 id="topbar-title">Gate Verification</h2>
      <div class="topbar-actions"><span class="text-muted" id="topbar-date"></span></div>
    </div>

    <div class="sds-content">

      <!-- ── GATE VERIFICATION ── -->
      <section id="tab-gate" class="tab-section">
        <div class="card" style="max-width:560px;">
          <div class="card-header"><span class="card-title">Log Vehicle Entry / Exit</span></div>
          <form id="gate-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label>Vehicle</label>
                <select id="gate-vehicle" class="form-control" required>
                  <option value="">Select Vehicle</option>
                </select>
              </div>
              <div class="form-group">
                <label>Event Type</label>
                <select id="gate-type" class="form-control">
                  <option value="entry">Entry</option>
                  <option value="exit">Exit</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Notes (optional)</label>
              <textarea id="gate-notes" class="form-control" rows="2" placeholder="Driver name, purpose, etc."></textarea>
            </div>
            <div class="form-error" id="gate-error"></div>
            <button type="submit" class="btn btn-primary">Log Event</button>
          </form>
        </div>

        <div class="card">
          <div class="card-header"><span class="card-title">Gate Log History</span></div>
          <div class="table-wrapper" id="gate-log-table"></div>
        </div>
      </section>

      <!-- ── VEHICLE MONITOR ── -->
      <section id="tab-vehicles" class="tab-section" style="display:none">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Vehicle Status Monitor</span>
          </div>
          <div class="table-wrapper" id="vehicle-monitor-table"></div>
        </div>
        <div class="card" style="max-width:500px;">
          <div class="card-header"><span class="card-title">Update Vehicle Status</span></div>
          <form id="vehicle-status-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label>Vehicle</label>
                <select id="vs-vehicle" class="form-control" required>
                  <option value="">Select Vehicle</option>
                </select>
              </div>
              <div class="form-group">
                <label>New Status</label>
                <select id="vs-status" class="form-control">
                  <option value="available">Available</option>
                  <option value="in-use">In Use</option>
                  <option value="maintenance">Maintenance</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Notes</label>
              <input type="text" id="vs-notes" class="form-control" placeholder="Reason for status change…">
            </div>
            <button type="submit" class="btn btn-primary">Update Status</button>
          </form>
        </div>
      </section>

      <!-- ── INCIDENTS ── -->
      <section id="tab-incidents" class="tab-section" style="display:none">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Incident Reports</span>
            <button class="btn btn-primary btn-sm" onclick="openIncidentModal()">+ Report Incident</button>
          </div>
          <div class="table-wrapper" id="incidents-table"></div>
        </div>
      </section>

      <!-- ── REPORTS ── -->
      <section id="tab-reports" class="tab-section" style="display:none">
        <div class="card">
          <div class="card-header"><span class="card-title">Generate Operational Report</span></div>
          <div class="form-group" style="max-width:280px;">
            <label>Report Type</label>
            <select id="report-type" class="form-control">
              <option value="gate_logs">Gate Log Summary</option>
              <option value="vehicles">Vehicle Status Report</option>
              <option value="incidents">Incident Summary</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="generateReport()">Generate Report</button>
        </div>
        <div class="card" id="report-output" style="display:none">
          <div class="card-header">
            <span class="card-title" id="report-title">Report</span>
            <span class="text-muted"  id="report-date"></span>
          </div>
          <div id="report-body"></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Saved Reports</span></div>
          <div class="table-wrapper" id="saved-reports-table"></div>
        </div>
      </section>

    </div>
  </div>
</div>

<!-- Incident Modal -->
<div class="modal-backdrop" id="incident-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Report Incident</span>
      <button class="modal-close" onclick="closeModal('incident-modal')">&times;</button>
    </div>
    <form id="incident-form" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label>Vehicle Involved</label>
          <select id="inc-vehicle" class="form-control"></select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="inc-date" class="form-control" required>
        </div>
      </div>
      <div class="form-group">
        <label>Incident Type</label>
        <select id="inc-type" class="form-control">
          <option value="accident">Accident</option>
          <option value="mechanical">Mechanical Issue</option>
          <option value="traffic">Traffic Violation</option>
          <option value="theft">Theft / Vandalism</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="inc-desc" class="form-control" rows="4" placeholder="Describe the incident…" required></textarea>
      </div>
      <div class="form-error" id="inc-error"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('incident-modal')">Cancel</button>
        <button type="submit" class="btn btn-warning">Submit Report</button>
      </div>
    </form>
  </div>
</div>

<script src="js/db.js"></script>
<script>
  const currentUser = SDS_AUTH.requireAuth('staff');
  if (!currentUser) throw new Error('Unauthorized');

  document.getElementById('sidebar-name').textContent  = currentUser.name;
  document.getElementById('sidebar-email').textContent = currentUser.email;
  document.getElementById('topbar-date').textContent   = new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function openModal(id)  { document.getElementById(id).classList.add('open'); }

  // ── Navigation ────────────────────────────────────
  document.querySelectorAll('.sds-sidebar nav a[data-tab]').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const tab = link.dataset.tab;
      document.querySelectorAll('.sds-sidebar nav a').forEach(a => a.classList.remove('active'));
      link.classList.add('active');
      document.querySelectorAll('.tab-section').forEach(s => s.style.display = 'none');
      document.getElementById('tab-' + tab).style.display = '';
      document.getElementById('topbar-title').textContent = link.textContent.trim();
      refreshTab(tab);
    });
  });

  function refreshTab(tab) {
    if (tab === 'gate')      { populateVehicleDropdown('gate-vehicle'); renderGateLogs(); }
    if (tab === 'vehicles')  { renderVehicleMonitor(); populateVehicleDropdown('vs-vehicle'); }
    if (tab === 'incidents') renderIncidents();
    if (tab === 'reports')   renderSavedReports();
  }

  function populateVehicleDropdown(id) {
    const vehicles = SDS_DB.getAll(SDS_DB.VEHICLES);
    document.getElementById(id).innerHTML =
      '<option value="">Select Vehicle</option>' + vehicles.map(v => `<option value="${v.id}">${v.plate} — ${v.model}</option>`).join('');
  }

  // ── Gate Verification ─────────────────────────────
  document.getElementById('gate-form').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('gate-error').textContent = '';
    const vehicleId = parseInt(document.getElementById('gate-vehicle').value);
    const type      = document.getElementById('gate-type').value;
    const notes     = document.getElementById('gate-notes').value.trim();
    if (!vehicleId) { document.getElementById('gate-error').textContent = 'Select a vehicle.'; return; }
    SDS_DB.create(SDS_DB.GATE_LOGS, { vehicleId, staffId: currentUser.id, type, notes, timestamp: new Date().toISOString() });
    SDS_UI.showToast('Gate event logged.');
    document.getElementById('gate-form').reset();
    renderGateLogs();
  });

  function renderGateLogs() {
    const logs     = [...SDS_DB.getAll(SDS_DB.GATE_LOGS)].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
    const vehicles = SDS_DB.getAll(SDS_DB.VEHICLES);
    const users    = SDS_DB.getAll(SDS_DB.USERS);
    if (!logs.length) { document.getElementById('gate-log-table').innerHTML = '<div class="empty-state"><div class="empty-icon">🚪</div>No gate events recorded yet.</div>'; return; }
    document.getElementById('gate-log-table').innerHTML = `
      <table>
        <thead><tr><th>#</th><th>Vehicle</th><th>Type</th><th>Staff</th><th>Timestamp</th><th>Notes</th></tr></thead>
        <tbody>
          ${logs.slice(0, 50).map(l => {
            const v = vehicles.find(x => x.id === l.vehicleId);
            const s = users.find(x => x.id === l.staffId);
            return `<tr>
              <td>${l.id}</td>
              <td>${v ? v.plate : '—'}</td>
              <td><span class="badge ${l.type === 'entry' ? 'badge-success' : 'badge-info'}">${l.type}</span></td>
              <td>${s ? s.name : '—'}</td>
              <td>${new Date(l.timestamp).toLocaleString()}</td>
              <td>${l.notes || '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  // ── Vehicle Monitor ───────────────────────────────
  function renderVehicleMonitor() {
    const vehicles = SDS_DB.getAll(SDS_DB.VEHICLES);
    if (!vehicles.length) { document.getElementById('vehicle-monitor-table').innerHTML = '<div class="empty-state"><div class="empty-icon">🚘</div>No vehicles.</div>'; return; }
    document.getElementById('vehicle-monitor-table').innerHTML = `
      <table>
        <thead><tr><th>Plate</th><th>Model</th><th>Year</th><th>Color</th><th>Status</th></tr></thead>
        <tbody>
          ${vehicles.map(v => `
            <tr>
              <td><strong>${v.plate}</strong></td>
              <td>${v.model}</td><td>${v.year}</td><td>${v.color || '—'}</td>
              <td>${SDS_UI.statusBadge(v.status)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }

  document.getElementById('vehicle-status-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const id     = parseInt(document.getElementById('vs-vehicle').value);
    const status = document.getElementById('vs-status').value;
    if (!id) { SDS_UI.showToast('Select a vehicle.', 'error'); return; }
    SDS_DB.update(SDS_DB.VEHICLES, id, { status });
    SDS_UI.showToast('Vehicle status updated.');
    renderVehicleMonitor();
  });

  // ── Incidents ─────────────────────────────────────
  function renderIncidents() {
    const incidents = [...SDS_DB.getAll(SDS_DB.INCIDENTS)].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    const vehicles  = SDS_DB.getAll(SDS_DB.VEHICLES);
    const users     = SDS_DB.getAll(SDS_DB.USERS);
    if (!incidents.length) { document.getElementById('incidents-table').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div>No incidents reported.</div>'; return; }
    document.getElementById('incidents-table').innerHTML = `
      <table>
        <thead><tr><th>#</th><th>Date</th><th>Vehicle</th><th>Type</th><th>Reported By</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          ${incidents.map(i => {
            const v = vehicles.find(x => x.id === i.vehicleId);
            const s = users.find(x => x.id === i.staffId);
            return `<tr>
              <td>${i.id}</td><td>${i.date}</td>
              <td>${v ? v.plate : '—'}</td>
              <td><span class="badge badge-warning">${i.type}</span></td>
              <td>${s ? s.name : '—'}</td>
              <td style="max-width:200px;white-space:normal">${i.description}</td>
              <td>${SDS_UI.statusBadge(i.status)}</td>
              <td>
                ${i.status === 'open' ? `<button class="btn btn-success btn-sm" onclick="resolveIncident(${i.id})">Resolve</button>` : '—'}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  function openIncidentModal() {
    document.getElementById('incident-form').reset();
    document.getElementById('inc-error').textContent = '';
    document.getElementById('inc-date').value = new Date().toISOString().split('T')[0];
    const vehicles = SDS_DB.getAll(SDS_DB.VEHICLES);
    document.getElementById('inc-vehicle').innerHTML =
      '<option value="">None / Unknown</option>' + vehicles.map(v => `<option value="${v.id}">${v.plate} — ${v.model}</option>`).join('');
    openModal('incident-modal');
  }

  document.getElementById('incident-form').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('inc-error').textContent = '';
    const vehicleId   = parseInt(document.getElementById('inc-vehicle').value) || null;
    const date        = document.getElementById('inc-date').value;
    const type        = document.getElementById('inc-type').value;
    const description = document.getElementById('inc-desc').value.trim();
    if (!date || !description) { document.getElementById('inc-error').textContent = 'Date and description are required.'; return; }
    SDS_DB.create(SDS_DB.INCIDENTS, { vehicleId, staffId: currentUser.id, date, type, description, status: 'open' });
    SDS_UI.showToast('Incident report submitted.', 'warning');
    closeModal('incident-modal');
    renderIncidents();
  });

  function resolveIncident(id) {
    SDS_DB.update(SDS_DB.INCIDENTS, id, { status: 'resolved' });
    SDS_UI.showToast('Incident marked as resolved.');
    renderIncidents();
  }

  // ── Reports ───────────────────────────────────────
  function generateReport() {
    const type  = document.getElementById('report-type').value;
    const types = { gate_logs: 'Gate Log Summary', vehicles: 'Vehicle Status Report', incidents: 'Incident Summary' };
    let html = '';
    if (type === 'gate_logs') {
      const gs = SDS_DB.getAll(SDS_DB.GATE_LOGS);
      html = `<p>Total gate events: ${gs.length} | Entries: ${gs.filter(g=>g.type==='entry').length} | Exits: ${gs.filter(g=>g.type==='exit').length}</p>`;
    }
    if (type === 'vehicles') {
      const vs = SDS_DB.getAll(SDS_DB.VEHICLES);
      html = `<p>Total vehicles: ${vs.length} | Available: ${vs.filter(v=>v.status==='available').length} | In Use: ${vs.filter(v=>v.status==='in-use').length} | Maintenance: ${vs.filter(v=>v.status==='maintenance').length}</p>`;
    }
    if (type === 'incidents') {
      const is = SDS_DB.getAll(SDS_DB.INCIDENTS);
      html = `<p>Total incidents: ${is.length} | Open: ${is.filter(i=>i.status==='open').length} | Resolved: ${is.filter(i=>i.status==='resolved').length}</p>`;
    }
    document.getElementById('report-title').textContent = types[type];
    document.getElementById('report-date').textContent  = 'Generated: ' + new Date().toLocaleString();
    document.getElementById('report-body').innerHTML    = html;
    document.getElementById('report-output').style.display = '';
    SDS_DB.create(SDS_DB.REPORTS, { type, title: types[type], generatedBy: currentUser.id, date: new Date().toISOString() });
    renderSavedReports();
  }

  function renderSavedReports() {
    const reports = [...SDS_DB.query(SDS_DB.REPORTS, r => r.generatedBy === currentUser.id)].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (!reports.length) { document.getElementById('saved-reports-table').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div>No reports yet.</div>'; return; }
    document.getElementById('saved-reports-table').innerHTML = `
      <table>
        <thead><tr><th>#</th><th>Title</th><th>Date</th></tr></thead>
        <tbody>${reports.map(r => `<tr><td>${r.id}</td><td>${r.title}</td><td>${SDS_UI.formatDate(r.createdAt)}</td></tr>`).join('')}</tbody>
      </table>`;
  }

  // Initial render
  populateVehicleDropdown('gate-vehicle');
  renderGateLogs();
</script>
</body>
</html>
