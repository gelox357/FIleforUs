<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Drive System — Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card wide">
    <div class="auth-logo">
      <div class="logo-icon">🚗</div>
      <h1>Create Account</h1>
      <p>Register as a new student / driver</p>
    </div>

    <form id="registerForm" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" class="form-control" placeholder="John" required>
          <div class="form-error" id="firstName-error"></div>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" class="form-control" placeholder="Doe" required>
          <div class="form-error" id="lastName-error"></div>
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        <div class="form-error" id="email-error"></div>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="555-0100">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required>
          <div class="form-error" id="password-error"></div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required>
          <div class="form-error" id="confirmPassword-error"></div>
        </div>
      </div>
      <div class="form-error" id="register-error" style="margin-bottom:10px;text-align:center;font-size:13px;"></div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <div class="auth-footer-link">
      Already have an account? <a href="index.html">Sign in</a>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script>
    (function () {
      const user = SDS_AUTH.getCurrentUser();
      if (user) window.location.href = 'index.html';
    })();

    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();
      // Clear errors
      ['firstName','lastName','email','password','confirmPassword'].forEach(f => {
        document.getElementById(f + '-error').textContent = '';
      });
      document.getElementById('register-error').textContent = '';

      const firstName       = document.getElementById('firstName').value.trim();
      const lastName        = document.getElementById('lastName').value.trim();
      const email           = document.getElementById('email').value.trim().toLowerCase();
      const phone           = document.getElementById('phone').value.trim();
      const password        = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      let valid = true;

      if (!firstName)  { document.getElementById('firstName-error').textContent = 'First name is required.'; valid = false; }
      if (!lastName)   { document.getElementById('lastName-error').textContent = 'Last name is required.'; valid = false; }
      if (!email)      { document.getElementById('email-error').textContent = 'Email is required.'; valid = false; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { document.getElementById('email-error').textContent = 'Enter a valid email.'; valid = false; }
      if (!password || password.length < 6) { document.getElementById('password-error').textContent = 'Password must be at least 6 characters.'; valid = false; }
      if (password !== confirmPassword) { document.getElementById('confirmPassword-error').textContent = 'Passwords do not match.'; valid = false; }
      if (!valid) return;

      // Check email uniqueness
      const existing = SDS_DB.query(SDS_DB.USERS, u => u.email === email);
      if (existing.length > 0) {
        document.getElementById('register-error').textContent = 'An account with this email already exists.';
        return;
      }

      SDS_DB.create(SDS_DB.USERS, {
        name: firstName + ' ' + lastName,
        email, phone, password,
        role: 'student',
        status: 'active'
      });

      // Auto-login after registration
      const user = SDS_AUTH.login(email, password);
      if (user) {
        window.location.href = 'student.html';
      }
    });
  </script>
</body>
</html>
